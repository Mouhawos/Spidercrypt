name: 🕷️ SpiderCrypt Enterprise — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ══════════════════════════════════════════════════════════════════════════════
# VARIABLES GLOBALES
# ══════════════════════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: "3.13"
  MIN_COVERAGE: "70"

# ══════════════════════════════════════════════════════════════════════════════
# JOBS
# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Tests & Couverture
  # ────────────────────────────────────────────────────────────────────────────
  tests:
    name: 🧪 Tests & Couverture
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov anyio

      - name: 🔧 Configurer PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:." >> $GITHUB_ENV

      - name: 🔐 Configurer les variables d'environnement de test
        run: |
          echo "SPIDERCRYPT_MASTER_KEY=$(python -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')" >> $GITHUB_ENV
          echo "ENV=test" >> $GITHUB_ENV
          echo "DEBUG=False" >> $GITHUB_ENV

      - name: 🧪 Lancer les tests Zero-Trust
        run: |
          pytest tests/services/test_zerotrust.py -v \
            --cov=core.zerotrust_engine \
            --cov-report=term-missing \
            --cov-report=xml:coverage-zerotrust.xml \
            --tb=short

      - name: 🧪 Lancer tous les tests disponibles
        run: |
          pytest tests/ -v \
            --cov=core \
            --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --tb=short \
            --ignore=tests/routers

      - name: 📊 Vérifier couverture minimum (${{ env.MIN_COVERAGE }}%)
        run: |
          pytest tests/services/ \
            --cov=core \
            --cov-fail-under=${{ env.MIN_COVERAGE }} \
            -q

      - name: 📤 Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Qualité du code
  # ────────────────────────────────────────────────────────────────────────────
  quality:
    name: 🔍 Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Installer les outils qualité
        run: |
          pip install ruff bandit

      - name: 🎨 Vérifier le style (Ruff)
        run: |
          ruff check core/ services/ routers/ --select=E,F,W \
            --ignore=E501,W291 \
            --exit-zero
        continue-on-error: true

      - name: 🔒 Audit de sécurité du code (Bandit)
        run: |
          bandit -r core/ services/ \
            -ll \
            --exit-zero \
            -f txt
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Vérification de l'API (sanity check)
  # ────────────────────────────────────────────────────────────────────────────
  api-check:
    name: 🌐 Vérification API
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: 🔐 Variables d'environnement
        run: |
          echo "SPIDERCRYPT_MASTER_KEY=$(python -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')" >> $GITHUB_ENV
          echo "ENV=test" >> $GITHUB_ENV
          echo "DEBUG=True" >> $GITHUB_ENV
          echo "SPIDERCRYPT_API_KEY=ci-test-key-001" >> $GITHUB_ENV

      - name: 🚀 Démarrer l'API en arrière-plan
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3
        continue-on-error: true

      - name: ❤️ Health check
        run: |
          curl -f http://localhost:8000/health || echo "API non disponible (normal si pas de DB)"
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Résumé final
  # ────────────────────────────────────────────────────────────────────────────
  summary:
    name: ✅ Résumé CI
    runs-on: ubuntu-latest
    needs: [tests, quality, api-check]
    if: always()

    steps:
      - name: 📋 Résumé
        run: |
          echo "════════════════════════════════════════"
          echo "  🕷️  SpiderCrypt Enterprise — CI Report"
          echo "════════════════════════════════════════"
          echo "  Tests        : ${{ needs.tests.result }}"
          echo "  Qualité      : ${{ needs.quality.result }}"
          echo "  API Check    : ${{ needs.api-check.result }}"
          echo "════════════════════════════════════════"

      - name: ❌ Échouer si les tests ont échoué
        if: needs.tests.result == 'failure'
        run: exit 1